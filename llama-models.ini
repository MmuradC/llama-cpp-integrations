version = 1

[*]
device             = CUDA0  ; RTX 5060 — switched from Vulkan1 2026-09; re-check with `llama-server --list-devices`
ngl                = 999
c                  = 32768
flash-attn         = on
parallel           = 1
jinja              = on
; threads left on auto (-1): tested explicit 14 (all P+E cores) on 2026-08-19,
; measured SLOWER generation (15.8 -> 13.9 tok/s) than the auto default of 6 —
; ggml's thread barriers make mixed P+E-core pools wait on the slow E-cores.
; auto-detect already lands on 6 (P-cores only), which is correct here.
sleep-idle-seconds = 600      ; unload model+KV cache after 10 min idle (~600MiB residual stays on GPU per subprocess — known llama.cpp limitation, ggml-org#19379)
; 2026-08-29 incident: qwen9b got stuck re-describing the same OCR line
; forever (own reasoning literally said "I'm stuck in a loop") and ran past
; 19k tokens / 9+ min before being killed by hand. Root cause: repeat-penalty
; had never been set, so it sat at llama-server's neutral default of 1.0 -
; nothing discouraged repeating the same tokens. 1.1 is llama.cpp's own
; traditional CLI default, mild enough not to hurt legitimate repetitive
; output (code, lists) while giving the sampler a way out of a loop.
repeat-penalty     = 1.1
; n-predict is a second, independent backstop for whatever repeat-penalty
; doesn't catch. Kept at 8192 as the *default* for small models (qwen9b is
; the one that actually looped), but see qwen35b's own override below:
; 2026-09-06 proved the "8192 is far above any normal response" assumption
; wrong for artifact generation - a tool call embedding a ~27KB HTML
; dashboard hit exactly 8192 and was cut off mid-string, which surfaced to
; the user as a confusing llama-server JSON parse error, not as a
; truncation. Anything that emits a large file inside a tool-call argument
; needs a much higher cap than ordinary chat does.
n-predict          = 8192
; default temp (0.80) is tuned for varied chat/creative output, not precise
; transcription - on visually ambiguous text (near-duplicate log lines) it
; made the reasoning waver between similar-probability readings instead of
; committing, burning the whole n-predict budget with no final answer
; (verified: same image, same prompt, only temp changed). 0.2 trades away
; response variety for determinism across the board - fine for coding/tool
; use, worth knowing if chat answers feel flatter than before.
temp               = 0.2

; Multilingual (100+ languages incl. Turkish) embedding model for RAG, own
; section not folded into [*]: the chat-tuned overrides above (repeat-penalty,
; n-predict, temp) only affect the sampler on a completion task, and an
; embeddings task never reaches the sampler - harmless no-ops here, left
; inherited rather than re-stated. CLS pooling (not mean) - verified against
; BGE-M3's own docs, this differs from most other embedding models.
[gpustack/bge-m3-GGUF:Q8_0]
alias      = embed
hf-repo    = gpustack/bge-m3-GGUF:Q8_0
embeddings = true
pooling    = cls
c          = 4096

[Youssofal/Qwen3.6-35B-A3B-Abliterated-Heretic-GGUF:Q4_K_M]
alias             = qwen35b
; hit the [*] default 32768 ctx and got truncated mid-conversation on
; 2026-09-06 (see journal: n_tokens=32767, truncated=1). Overriding just
; for this model (not the [*] default — qwen9b/embed don't need it and
; this model is the VRAM-tight one) with a bigger context, made to fit by
; quantizing the KV cache to q8_0 instead of f16 — flash-attn (already on
; globally) is what makes non-contiguous q8_0 V-cache viable at all.
; Empirically bisected: 98304 OOMs at load (compute-buffer alloc, short by
; only 556MiB), 65536 loads with ~22MiB VRAM to spare — thin at idle, but
; stress-tested with a real 13009-token prompt (not just idle load) and it
; processed cleanly at ~115 tok/s, truncated=0, VRAM held steady. Margin is
; tight enough that pushing further wasn't worth the risk — this is a
; verified 2x over the old ceiling, not a theoretical one.
c                 = 65536
cache-type-k      = q8_0
cache-type-v      = q8_0
; Overrides [*]'s 8192. This is the model that gets the big build-me-a-page
; tasks, and those emit the whole file inside one tool-call JSON argument -
; 2026-09-06 a 5G dashboard needed >8192 and got sliced mid-JS, producing a
; "missing closing quote" parse error rather than an obvious truncation
; (root cause confirmed from the journal: eval time = ... / 8192 tokens,
; exactly the cap). ~27KB of escaped HTML is roughly 10k tokens, plus this
; model emits a reasoning block before the answer, so 24576 gives ~2x
; headroom over the observed need. Deliberately NOT unlimited: it is still
; the runaway backstop, just a realistic one. Worth knowing the cost - at
; this model's ~6 tok/s a true runaway now burns ~68 min instead of ~23
; before anything stops it, so repeat-penalty above stays the first line of
; defence, not this.
n-predict         = 24576
; re-tuned 2026-09-06 for CUDA0 (was 34, tuned for Vulkan1): swept
; 34/30/26 down to 29 on this exact model+prompt, 30 is the lowest that
; still fits (~7.5GB used vs ~7.6GB free) — 29 and 26 both OOM on load.
; Warm, 190-token prompt: 95-112 tok/s prompt (vs 63.4 on Vulkan1),
; 14.1-14.8 tok/s generation (vs 15.8 on Vulkan1, at n-cpu-moe=34 back then).
; 2026-09-09: that ~22MB idle margin at 30 wasn't enough for real use — the
; instance hard-crashed 3x in 30min with "CUDA error: out of memory"
; (ggml-cuda.cu:108, ggml aborts the whole process on this, not just the
; request). Bumped to 32 for real headroom; costs a little speed but a
; crashed instance is slower than that in practice (full reload from mmap).
n-cpu-moe         = 32
load-mode         = mmap
no-mmproj-offload = true

[mradermacher/Huihui-Qwen3.5-9B-abliterated-GGUF:Q4_K_M]
alias   = qwen9b
; 2026-09-12: swapped from unsloth/Qwen3.5-9B-GGUF (censored) to Huihui's
; abliterated build, found while researching whether anything newer beats
; qwen35b on this hardware (verdict: no - see llama-cpp-model-performance
; memory) but this swap was a genuine free win for the small/fast tier.
; Huihui's abliteration is well-established (huihui-ai), this GGUF has
; 51k+ monthly downloads. Verified standalone (full GPU offload, warm
; second request): 151 tok/s prompt / 37 tok/s generation - faster than
; the old unsloth quant's documented 47/27.3, and uncensored where the
; old one wasn't.
hf-repo = mradermacher/Huihui-Qwen3.5-9B-abliterated-GGUF:Q4_K_M
; 2026-09-12: overriding [*]'s 32768 - this model is small enough (5.7GB,
; fully on GPU with room to spare) to afford a much bigger context than the
; VRAM-tight qwen35b gets. Empirically bisected: 131072 OOMs at load
; (couldn't even allocate the model's own tensors), 65536 loads clean AND
; stress-tested with a real 16025-token prompt - not just idle load -
; processed at 1546.71 tok/s prompt / 38.41 tok/s generation, both *better*
; than the small warm-prompt baseline (113/27). c=131072 is genuinely too
; much for this quant+context combo alongside the compute buffer; didn't
; bisect further between 65536-131072 since 65536 already covers any
; realistic single-conversation use for this model's fast/utility role.
c            = 65536
cache-type-k = q8_0
cache-type-v = q8_0
; 2026-09-15: vision projector added - it was MISSING, and that is not a
; subtle failure. Without --mmproj llama-server starts text-only: an image
; request still returns HTTP 200, but with an EMPTY content field, so every
; vision tool call came back as "no response" and surfaced in the UI as a
; bare "Internal server error". Confirmed from this box: the running
; subprocess cmdline had no --mmproj, and a direct POST to its port
; answered 200 with content == "".
;
; The repo ships one (Huihui-Qwen3.5-9B-abliterated.mmproj-Q8_0.gguf, 596M,
; already in the HF cache), so this points straight at it rather than at a
; repo spec: the path is local and cannot be mis-resolved by the downloader.
;
; no-mmproj-offload keeps the projector on the CPU. The 9B itself fits with
; room to spare, but not alongside a 596M projector: this entry's 65536-token
; q8_0 KV cache is already sized to just fit an 8151MiB card (551M budget is
; the documented comfortable margin), and llama.cpp aborts the whole process
; on a CUDA OOM rather than failing the request - see the qwen35b notes for
; the three crashes that taught us that. Vision encoding on CPU costs a few
; seconds per image, which is the right trade for a tool call. If a future
; card has the headroom, deleting this one line moves the encoder back to GPU.
; 2026-09-15: reasoning disabled. Qwen3.5's template thinks by default, and
; on image/OCR tasks the thinking stream alone ate the whole n-predict budget
; with message.content left EMPTY (finish_reason=length, ~7k chars of
; reasoning and zero answer text) - to the vision MCP client that dunk
; looked like a dropped connection and surfaced as "no response": the
; server ran, processed the image, and returned a blank. `reasoning = off`
; passes LLAMA_ARG_REASONING=off so the template skips the think block.
; If you want this model to think in chat, move this line to per-session
; chat settings and set it there instead - but vision tools will break again.
reasoning = off

mmproj            = /home/murad/.cache/huggingface/hub/models--mradermacher--Huihui-Qwen3.5-9B-abliterated-GGUF/snapshots/9f646d7eda193ddf2348134f3bff3d49eed7a2c6/Huihui-Qwen3.5-9B-abliterated.mmproj-Q8_0.gguf
no-mmproj-offload = true
